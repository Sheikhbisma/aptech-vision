<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- bootstrap5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <!-- css -->
  <title>EduSindh Blog</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7fb;
      color: #072b4f;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
   
    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #072b4f;
      color: #fff;
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.2);
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      border-bottom: 2px solid #00eaff;
      padding-bottom: 10px;
    }
    .filter-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-btns button {
      background: #072b4f;
      border: 1px solid #00eaff;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .filter-btns button:hover,
    .filter-btns button.active {
      background: #00eaff;
      color: #000;
    }

    /* Main content */
    .main-content {
      flex: 1;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 20px;
      color: #072b4f;
    }
    .card-container {
      display: grid;
       grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 50px;
    }
    .card {
      background: #fff;
      border: 2px solid #00eaff;
      color: #072b4f;
      border-radius: 15px;
      padding: 20px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;        /* full width of grid column */
  max-width: 100%;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(0, 234, 255, 0.5);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      max-width: 600px;
      border-radius: 12px;
      color: #072b4f;
      text-align: left;
    }
    .modal-content h2 {
      margin-top: 0;
    }
    .close {
      float: right;
      cursor: pointer;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Categories</h2>
    <div class="filter-btns" id="filterBtns"></div>
  </div>

  <!-- Main -->
  <div class="main-content">
    <h1>EduSindh Blog</h1>
    <div class="card-container" id="cardContainer"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h2 id="modalTitle"></h2>
      <p id="modalDetails"></p>
    </div>
  </div>

  <script>
    let blogData = [];
    let currentCategory = '';

    async function loadData() {
      const res = await fetch('blog.json');
      const data = await res.json();
      blogData = data.categories;
      renderFilters();
      renderCards(blogData[0].name); // default first category
    }

    function renderFilters() {
      const filterBtns = document.getElementById('filterBtns');
      filterBtns.innerHTML = '';
      blogData.forEach((cat, index) => {
        const btn = document.createElement('button');
        btn.textContent = cat.name;
        if(index === 0) btn.classList.add("active");
        btn.onclick = () => {
          document.querySelectorAll(".filter-btns button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderCards(cat.name);
        };
        filterBtns.appendChild(btn);
      });
    }

    function renderCards(categoryName) {
      currentCategory = categoryName;
      const cardContainer = document.getElementById('cardContainer');
      cardContainer.innerHTML = '';
      const category = blogData.find(c => c.name === categoryName);
      category.posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${post.title}</h3>
          <p>${post.description}</p>
        `;
        card.onclick = () => openModal(post);
        cardContainer.appendChild(card);
      });
    }

    function openModal(post) {
      document.getElementById('modalTitle').textContent = post.title;
      document.getElementById('modalDetails').textContent = post.details;
      document.getElementById('modal').style.display = 'flex';
    }

    document.getElementById('closeModal').onclick = () => {
      document.getElementById('modal').style.display = 'none';
    };

    window.onclick = (e) => {
      if (e.target === document.getElementById('modal')) {
        document.getElementById('modal').style.display = 'none';
      }
    };

    loadData();
  </script>


<!-- bootstrap js bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

</body>
</html>
