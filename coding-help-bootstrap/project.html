<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback - Bootstrap + jQuery</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <style>
    body {
      background: #f1f3f6;
    }
    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero img {
      max-width: 250px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#">Fashionest</a>
      <button class="btn btn-light">Hello Dear!</button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero container">
    <div>
      <h1 class="fw-bold text-primary">Welcome to Fashionest</h1>
      <p class="lead text-muted">Your opinion matters! Please share your valuable feedback with us.</p>
      <button class="btn btn-success btn-lg mt-3" data-bs-toggle="modal" data-bs-target="#feedbackModal">Give Feedback</button>
      <br>
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Student Feedback">
    </div>
  </section>

  <!-- Modal -->
  <div class="modal fade" id="feedbackModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Student Feedback Form</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="feedbackForm">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label for="feedback" class="form-label">Feedback</label>
              <textarea id="feedback" class="form-control" rows="3" placeholder="Write your feedback"></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery + Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <script>
    $(document).ready(function() {
      $("#feedbackForm").submit(function(e) {
        e.preventDefault();

        let name = $("#name").val().trim();
        let email = $("#email").val().trim();
        let feedback = $("#feedback").val().trim();

        if (name === "" || email === "" || feedback === "") {
          alert("⚠ Please fill all fields before submitting.");
          return;
        }

        alert("✅ Thank you " + name + "! Your feedback has been submitted.");
        $("#feedbackForm")[0].reset();
        $("#feedbackModal").modal("hide");
      });
    });
  </script>
</body>
</html>
